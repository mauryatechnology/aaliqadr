# Secret scanning (plan.md §13.1). Built-in rules plus a rule for hard-coded passwords.
title = "Aaliqadr gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "hardcoded-password-assignment"
description = "A password written into source code"
regex = '''(?i)(?:password|passwd|pwd|secret)[a-z_]*\s*[:=]\s*["'][^"'\s]{8,}["']'''
keywords = ["password", "passwd", "pwd", "secret"]
[rules.allowlist]
paths = ['''\.env\.example$''', '''^tests/''', '''^scripts/dev/''', '''^docs/''']
regexes = ['''dummy''', '''example''', '''change-me''', '''placeholder''', '''••••''']
